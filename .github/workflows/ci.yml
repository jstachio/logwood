name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['21', '25', '27']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up the test runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
      - name: Remember the test runtime
        run: echo "TEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Set up current javac and javadoc
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - name: Build with current tools and test the selected runtime
        run: |
          profiles=()
          if [[ '${{ matrix.java }}' == '21' ]]; then
            profiles=(-P-scoped-key-values)
          fi
          ./mvnw --batch-mode --no-transfer-progress clean install \
            "-Dtest.java.home=${TEST_JAVA_HOME}" "${profiles[@]}"
      - run: '"${TEST_JAVA_HOME}/bin/java" -jar example/target/logwood-example.jar'
      - run: '"${TEST_JAVA_HOME}/bin/java" -Dlogging.format=jsonl -jar example/target/logwood-example.jar'
      - name: Verify example is excluded from deployment
        run: |
          example_repo="${RUNNER_TEMP}/logwood-example-deploy"
          ./mvnw --batch-mode -pl example deploy \
            -Dmaven.deploy.skip=false \
            "-DaltDeploymentRepository=example-check::file://${example_repo}"
          test ! -e "${example_repo}/io/jstach/logwood/logwood-example"
      - name: Check library nullness
        if: matrix.java == '27'
        run: bin/analyze.sh
      - name: Check standalone build tools
        if: matrix.java == '27'
        run: bin/test-tools.sh
