name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
      - run: ./mvnw --batch-mode clean install javadoc:javadoc
      - run: java -jar example/target/balsa-example.jar
      - name: Verify example is excluded from deployment
        run: |
          example_repo="${RUNNER_TEMP}/balsa-example-deploy"
          ./mvnw --batch-mode -pl example deploy \
            -Dmaven.deploy.skip=false \
            "-DaltDeploymentRepository=example-check::file://${example_repo}"
          test ! -e "${example_repo}/io/jstach/balsa/balsa-example"
