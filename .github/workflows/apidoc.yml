name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - run: bin/doc.sh
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error \
            --output "${RUNNER_TEMP}/logwood-pages.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          case "$status" in
            200) echo 'enabled=true' >> "$GITHUB_OUTPUT" ;;
            404)
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo 'Documentation built. Select GitHub Actions as the Pages source to enable deployment.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "Pages configuration request failed: HTTP ${status}" >&2; exit 1 ;;
          esac
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: target/reports/apidocs
      - name: Deploy to Pages
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
